<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pradera en calma</title>
<style>
:root{color-scheme:light dark;--btn:rgba(255,255,255,.55);--btn-ink:#2f5d3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--btn:rgba(255,255,255,.5);--btn-ink:#2f5d3a}}
html,body,#root{margin:0;height:100%;overflow:hidden;background:#8fd3f4}
svg.scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.cloud{animation:drift 240s linear infinite}
@keyframes drift{from{transform:translateX(-1300px)}to{transform:translateX(3400px)}}
.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.paused *{animation-play-state:paused !important}
button.pp{position:static;flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;display:grid;place-items:center;padding:0;backdrop-filter:blur(4px)}
button.pp:hover{background:rgba(255,255,255,.8)}
button.pp:focus-visible{outline:2px solid var(--btn-ink);outline-offset:2px}
.bar{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.np{position:fixed;z-index:3;top:calc(max(12px,env(safe-area-inset-top,0px)) + 48px);right:max(14px,env(safe-area-inset-right,0px));font:12px/1.35 system-ui,sans-serif;color:var(--btn-ink)}
.np .box{width:min(244px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;padding:10px 12px 12px;border-radius:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(4px)}
.np .hd2{font-weight:600;margin-bottom:8px}
.np .sep{margin-top:10px;padding-top:10px;border-top:1px solid rgba(47,93,58,.18)}
.np .rs{height:30px;padding:0 12px;border:0;border-radius:15px;background:rgba(47,93,58,.12);color:inherit;font:inherit;cursor:pointer}
.np .rs.danger{background:#b8402c;color:#fff}
.np .ask{padding:8px;border-radius:10px;background:rgba(184,64,44,.1)}
.np .row{display:flex;gap:6px;margin-top:8px}
.np label{display:block;margin-bottom:8px}.np label b{float:right;font-weight:600}
.np input{display:block;width:100%;margin:4px 0 0;accent-color:#3f8c3d}
.np .st{font-weight:600}.np .st.over{color:#b8402c}
.pz{position:fixed;top:calc(max(12px,env(safe-area-inset-top,0px)) + 62px);left:50%;transform:translateX(-50%);padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.6);color:var(--btn-ink);font:12px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .5s;pointer-events:none}
.pz.on{opacity:1}
.np .modes{display:flex;gap:4px;margin-bottom:8px}
.np .modes button{flex:1;height:26px;border:0;border-radius:13px;background:rgba(47,93,58,.12);color:inherit;font:inherit;cursor:pointer}
.np .modes button.on{background:var(--btn-ink);color:#fff}
.np .msg{margin-top:4px;opacity:.85}
.np input:disabled{opacity:.55}
.al{position:fixed;z-index:2;bottom:max(14px,env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));font:12px/1.35 system-ui,sans-serif;color:var(--btn-ink)}
.al .tg{position:relative;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 10px;border:2px solid #bcd3a4;border-radius:14px;background:linear-gradient(#fffaf0,#f1ecd2);color:#3b6b3a;font:inherit;font-weight:600;letter-spacing:.2px;cursor:pointer;box-shadow:0 2px 0 #a9c293,0 5px 10px rgba(47,93,58,.18);transition:transform .12s,box-shadow .12s,background .2s}
.al .tg .ic{width:20px;height:20px;flex:none}
.al .tg:active{transform:translateY(1px);box-shadow:0 1px 0 #a9c293,0 3px 6px rgba(47,93,58,.18)}
.al .tg[aria-expanded="true"]{background:linear-gradient(#f3f9e6,#e3efcf)}
.al .tg:focus-visible{outline:2px solid #3f8c3d;outline-offset:2px}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.al .tg:hover{background:linear-gradient(#fffdf5,#f6f1da)}
.al .dot{position:absolute;top:-5px;right:-4px;width:12px;height:12px;border-radius:50%;background:#e8503a;border:2px solid #fffaf0;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.25);animation:pop 1.8s ease-in-out infinite}
.al .box{margin:0 0 8px;width:min(92vw,560px);max-height:calc(100vh - 110px);overflow:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.9);backdrop-filter:blur(4px)}
.al .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.al .x{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:2px 6px}
.al .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.al .card{height:132px;box-sizing:border-box;padding:6px;border-radius:12px;background:#f4f8ee;border:2px solid #cfe3bf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.al .card svg{width:100%;height:86px}
.al .nm{font-weight:600}
.al .mis{background:#e7eee0;border:2px dashed #b9cfa8}
.al .q{font:700 44px/1 system-ui,sans-serif;opacity:.45}
.hud{position:fixed;z-index:1;top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:auto 112px;align-items:center;gap:7px 8px;box-sizing:border-box;padding:8px 12px;border-radius:12px;background:rgba(255,250,240,.84);border:2px solid #cfe3bf;font:600 11px/1 system-ui,sans-serif;color:#3b6b3a;pointer-events:none;backdrop-filter:blur(4px)}
.hud[data-modo="viva"] .rw{display:none}
.hud .trk{position:relative;height:7px;border-radius:4px;background:#dfe9d0}
.hud .trk i{display:block;height:100%;width:0;border-radius:4px}
.hud .lv{background:linear-gradient(90deg,#9fd77a,#5aa84a)}
.hud.over .lv{background:linear-gradient(90deg,#f2b35e,#d9573c)}
.hud .mk{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:#3b6b3a}
.hud .fill{background:linear-gradient(90deg,#9fd77a,#5aa84a);transition:background .3s}
.hud.hold .fill{background:linear-gradient(90deg,#d9d2b0,#c3bb94)}
@media (max-width:480px){.hud{left:max(14px,env(safe-area-inset-left,0px));transform:none}.pz{left:max(14px,env(safe-area-inset-left,0px));transform:none}}
.np .lbl{font-weight:600;margin:2px 0 4px}
.np .chips{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.np .chips button{height:26px;border:0;border-radius:13px;background:rgba(47,93,58,.12);color:inherit;font:inherit;cursor:pointer}
.np .chips button.on{background:var(--btn-ink);color:#fff}
@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes brisa{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.brisa{animation:brisa 8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.np select{width:100%;height:28px;margin-bottom:6px;padding:0 6px;border-radius:8px;border:1px solid rgba(47,93,58,.3);background:#fff;color:inherit;font:inherit}
.np .note{font-size:11px;line-height:1.35;opacity:.8;margin:6px 0 2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useRef,useEffect,useState,memo}=React;

const legPath=(c,b)=>`M${c-14} 142 C${c-15+b} 168 ${c-11+b} 190 ${c-10} 210 C${c-10} 219 ${c-11} 224 ${c-11} 228 L${c-12} 240 C${c-6} 242 ${c+6} 242 ${c+12} 240 L${c+11} 228 C${c+11} 224 ${c+10} 219 ${c+10} 210 C${c+11} 190 ${c+15} 168 ${c+14} 142Z`;
const hoofPath=c=>`M${c-11} 228 C${c-4} 230 ${c+4} 230 ${c+11} 228 L${c+12} 240 C${c+6} 242 ${c-6} 242 ${c-12} 240Z`;
const Leg=({id,c,b,r,fill})=>(
  <g id={id} ref={r} style={{transformOrigin:`${c}px 142px`}}>
    <path d={legPath(c,b)} fill={fill}/><path d={hoofPath(c)} fill="#4a3b36"/>
  </g>
);

const BODY="M48 110 C46 94 64 84 92 83 C124 81 160 85 196 84 C226 83 246 92 258 108 C272 126 276 152 264 170 C254 186 234 190 208 188 C172 190 124 190 94 188 C64 188 50 172 48 150 C47 136 49 122 48 110Z";
const HEAD="M288 100 C304 92 322 104 334 122 C344 132 353 143 353 156 C353 168 345 174 335 173 C324 172 316 164 304 161 C292 160 284 148 284 132 C284 118 282 106 288 100Z";

const Cow=({R,u})=>(

    <g id={`cabeza-${u}`} ref={e=>R.headO=e} style={{transformOrigin:"222px 112px"}}>
      <g id={`cara-${u}`} ref={e=>R.head=e} style={{transformOrigin:"292px 124px"}}>
        <clipPath id={`ch-${u}`}><path d={HEAD}/></clipPath>
        <path d="M298 101 C298 90 304 85 311 86 C308 91 308 96 309 103Z" fill="#efe3c4"/>
        <path d={HEAD} fill="#fbf8f1"/>
        <path d="M286 100 C300 91 318 96 326 108 C312 112 296 114 285 112Z" fill="#3b3633" clipPath={`url(#ch-${u})`}/>
        <path d="M338 136 C349 142 356 150 354 161 C352 170 345 175 335 173 C328 172 330 160 331 150 C332 143 334 139 338 136Z" fill="#f2b3ad"/>
        <path d="M296 106 C282 97 264 99 256 110 C268 121 286 121 298 115Z" fill="#3b3633"/>
        <path d="M290 107 C281 103 271 105 266 110 C274 115 284 115 292 112Z" fill="#f2b3ad"/>
        <circle cx="321" cy="125" r="3.6" fill="#2a2523"/><circle cx="322.2" cy="123.8" r="1.1" fill="#fff"/>
        <path d="M345 150 C347 148 350 149 350 152" stroke="#b9776f" strokeWidth="2" fill="none" strokeLinecap="round"/>
        <path d="M337 169 C343 169 349 167 351 163" stroke="#c98a82" strokeWidth="1.8" fill="none" strokeLinecap="round"/>
      </g>
    </g>
  </g>
);

const DOME="M24 47 C22 32 32 19 52 15 C76 10 102 14 116 26 C124 33 124 42 120 47 C100 50 50 50 24 47Z";
const mleg=c=>`M${c-6} 40 C${c-8} 50 ${c-6} 56 ${c-6} 60 C${c-6} 63 ${c-3} 64 ${c+1} 64 L${c+9} 64 C${c+11} 64 ${c+11} 61.5 ${c+8} 61 C${c+6} 60 ${c+6} 58 ${c+6} 56 C${c+6} 50 ${c+7} 46 ${c+6} 40Z`;
const mnail=c=>`M${c+8} 61 C${c+11} 61 ${c+12.5} 63 ${c+12.5} 64.5 C${c+10.5} 64.2 ${c+8.8} 63.3 ${c+8} 61Z`;
const MLeg=({id,c,fill,r})=>(
  <g id={id} ref={r} style={{transformOrigin:`${c}px 42px`}}>
    <path d={mleg(c)} fill={fill}/><path d={mnail(c)} fill="#5e4a3e"/>
  </g>
);
const bandX=Array.from({length:8},(_,i)=>52+i*6.3);
const bandLine=x=>`M${x} 8 C${x+3} 22 ${x+3} 36 ${x-1} 52`;
const bandFill=(x,x2)=>`M${x} 8 L${x2} 8 C${x2+3} 22 ${x2+3} 36 ${x2-1} 52 L${x-1} 52 C${x+3} 36 ${x+3} 22 ${x} 8Z`;

const Mulita=({R,u})=>(
  <g>
    <ellipse cx="82" cy="64.5" rx="70" ry="5" fill="#2f6b32" opacity=".28"/>
    <MLeg id={`mulita-pata-trasera-lejana-${u}`} c={52} fill="#bda68f" r={e=>R.mbf=e}/>
    <MLeg id={`mulita-pata-delantera-lejana-${u}`} c={88} fill="#bda68f" r={e=>R.mff=e}/>
    <g id={`mulita-cola-${u}`} ref={e=>R.mtail=e} style={{transformOrigin:"24px 42px"}}>
      <path d="M26 36 C16 35 7 41 3 50 C2 53 5 54 8 52 C14 47 20 46 27 47Z" fill="#d0b49a"/>
    </g>
    <g id={`mulita-cabeza-${u}`} ref={e=>R.mhead=e} style={{transformOrigin:"106px 40px"}}>
      <path d="M117 29 C116 21 119 17 123 18 C126 22 126 27 125 31Z" fill="#c9ac93"/>
      <path d="M100 30 C112 25 126 27 136 34 C144 40 151 45 157 49 C158 52 155 54 151 53 C140 52 128 53 118 51 C106 49 98 42 100 30Z" fill="#d9c0a8"/>
      <circle cx="131" cy="34" r="1.9" fill="#2a2523"/><circle cx="131.6" cy="33.4" r=".6" fill="#fff"/>
      <path d="M152 49 C154 48.5 155.5 49.5 155.5 51" stroke="#8a6a58" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
      <path d="M149 52.5 C142 52 136 50.5 131 48.5" stroke="#b08f78" strokeWidth="1.1" fill="none" strokeLinecap="round"/>
    </g>
    <MLeg id={`mulita-pata-trasera-cercana-${u}`} c={38} fill="#d9c0a8" r={e=>R.mbn=e}/>
    <MLeg id={`mulita-pata-delantera-cercana-${u}`} c={100} fill="#d9c0a8" r={e=>R.mfn=e}/>
    <g id={`mulita-caparazon-${u}`}>
      <clipPath id={`cm-${u}`}><path d={DOME}/></clipPath>
      <path d={DOME} fill="#b4aea3"/>
      <g clipPath={`url(#cm-${u})`}>
        <path d="M18 6 L46 6 C52 22 52 38 48 54 L18 54Z" fill="#9d978c"/>
        <path d="M98 6 C104 22 106 38 102 54 L132 54 L132 6Z" fill="#9d978c"/>
        {bandX.slice(0,7).filter((_,i)=>i%2===0).map(x=><path key={x} d={bandFill(x,x+6.3)} fill="#bdb7ac"/>)}
        {bandX.map(x=><path key={x} d={bandLine(x)} stroke="#7d776d" strokeWidth="1.5" fill="none"/>)}
        <path d="M46 6 C52 22 52 38 48 54 M98 6 C104 22 106 38 102 54" stroke="#7d776d" strokeWidth="1.8" fill="none"/>
        <g fill="#857f74"><circle cx="30" cy="34" r="1.3"/><circle cx="36" cy="26" r="1.3"/><circle cx="42" cy="36" r="1.3"/><circle cx="36" cy="41" r="1.3"/><circle cx="40" cy="22" r="1.3"/>
          <circle cx="107" cy="30" r="1.3"/><circle cx="113" cy="37" r="1.3"/><circle cx="108" cy="41" r="1.3"/><circle cx="115" cy="29" r="1.3"/><circle cx="106" cy="22" r="1.3"/></g>
        <path d="M46 24 C62 14 92 14 108 24 C92 20 64 20 46 24Z" fill="#cbc5ba" opacity=".8"/>
      </g>
      <path d="M24 47 C50 50 100 50 120 47" stroke="#7d776d" strokeWidth="2" fill="none" strokeLinecap="round"/>
    </g>
  </g>
);

const tleg=c=>`M${c} 56 C${c+1} 70 ${c-3} 78 ${c-1} 86 C${c} 92 ${c} 95 ${c} 98`;
const TLeg=({id,c,col,r})=>(
  <g id={id} ref={r} style={{transformOrigin:`${c}px 58px`}}>
    <path d={tleg(c)} stroke={col} strokeWidth="2.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    <path d={`M${c-3} 99.4 C${c+1} 100.4 ${c+5} 100.4 ${c+9} 99.4`} stroke={col} strokeWidth="2.4" fill="none" strokeLinecap="round"/>
  </g>
);
const Tero=({R,u})=>(
  <g>
    <defs><linearGradient id={`tg-${u}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#a9a8a2"/><stop offset=".6" stopColor="#a9a8a2"/><stop offset="1" stopColor="#968b7b"/></linearGradient></defs>
    <ellipse cx="50" cy="101" rx="38" ry="3.6" fill="#2f6b32" opacity=".28"/>
    <TLeg id={`tero-pata-lejana-${u}`} c={57} col="#b84c47" r={e=>R.tfar=e}/>
    <TLeg id={`tero-pata-cercana-${u}`} c={44} col="#e0675f" r={e=>R.tnear=e}/>
    <g id={`tero-cuerpo-${u}`} ref={e=>R.ttorso=e} style={{transformOrigin:"50px 60px"}}>
      <path d="M14 44 C8 46 2 50 1 55 C7 57 13 55 17 52Z" fill="#3b3633"/>
      <path d="M12 46 C16 36 32 32 50 33 C64 34 74 40 76 48 C77 58 66 66 50 67 C32 68 18 62 12 52Z" fill="#f7f4ec"/>
      <g id={`tero-cabeza-${u}`} ref={e=>R.thead=e} style={{transformOrigin:"66px 46px"}}>
        <path d="M80 20 C72 12 62 11 54 14 C63 15 70 19 77 24Z" fill="#2f2b2b"/>
        <path d="M56 46 C57 40 60 38 64 37 C68 36 70 34 72 31 C74 27 77 22 82 20 C88 17.5 95 20 96.5 26 C97.5 31 93.5 34 88.5 35 C84 36.5 80 37 77 40 C75 44 75 49 76 53 L70 58 L58 56Z" fill={`url(#tg-${u})`}/>
        <path d="M86 28 C92 28 95.5 30 94.5 33 C92.5 35 91 35 88.5 35 C84 36.5 80 37 77 40 C75 44 75 49 76 53 L68 58 C67 51 70 44 74 38 C76 33 80 30 86 28Z" fill="#2f2b2b"/>
        <path d="M95 26 C102 27 107 30 110 33 C103 33 99 32 95 31Z" fill="#e0605a"/>
        <path d="M106 31.2 L110 33 L105.5 33Z" fill="#2f2b2b"/>
        <circle cx="89" cy="25" r="2.2" fill="#c63b3b"/><circle cx="89.3" cy="24.8" r=".9" fill="#2a2523"/>
      </g>
      <path d="M13 45 C17 36 32 32 50 33 C60 34 68 37 72 42 C58 44 38 48 22 55 C16 54 13 50 13 45Z" fill="#8d7557"/>
      <path d="M24 44 C38 39 56 41 66 45 C54 52 36 56 22 52Z" fill="#6f5a43"/>
      <path d="M56 43 C62 39 71 38 76 45 C78 54 73 63 64 64 C56 61 54 50 56 43Z" fill="#2f2b2b"/>
    </g>
  </g>
);

const fleg=c=>`M${c-5} 58 C${c-5} 74 ${c-3} 84 ${c-3} 94 L${c-4} 100 L${c+4.5} 100 L${c+3.5} 94 C${c+3} 84 ${c+5} 74 ${c+5} 58Z`;
const fsock=c=>`M${c-3.2} 86 L${c+3.3} 86 L${c+3.6} 94 L${c+4.5} 100 L${c-4} 100 L${c-3.8} 94Z`;
const FLeg=({id,c,fill,r})=>(
  <g id={id} ref={r} style={{transformOrigin:`${c}px 58px`}}>
    <path d={fleg(c)} fill={fill}/><path d={fsock(c)} fill="#5b4636"/>
  </g>
);
const Fox=({R,u})=>(
  <g>
    <ellipse cx="100" cy="100.5" rx="84" ry="6" fill="#2f6b32" opacity=".28"/>
    <FLeg id={`zorro-pata-trasera-lejana-${u}`} c={76} fill="#a77d52" r={e=>R.zbf=e}/>
    <FLeg id={`zorro-pata-delantera-lejana-${u}`} c={108} fill="#a77d52" r={e=>R.zff=e}/>
    <g id={`zorro-cola-${u}`} ref={e=>R.ztail=e} style={{transformOrigin:"46px 46px"}}>
      <path d="M46 46 C30 36 12 38 5 50 C0 60 6 72 17 74 C29 76 41 66 47 56Z" fill="#9a8f84"/>
      <path d="M46 44 C30 34 13 36 6 46 C18 40 32 42 47 50Z" fill="#6f665c"/>
      <path d="M5 52 C0 60 6 72 17 74 C10 66 8 58 12 50Z" fill="#2f2b2b"/>
      <path d="M24 70 C34 70 42 64 47 56 C42 62 34 66 24 70Z" fill="#efe3cc"/>

// Cuello del ñandú: una única forma continua. Se dibuja cada cuadro a partir de una línea central de largo constante cuya
// curvatura va de "erguido" (e=0) a "agachado" (e=1); el ancho se afina desde la base (dentro del pecho) hasta la cabeza.
const nandNeck=(e,sw=0)=>{
  const N=18, L=86, ds=L/N, P=[[100,74]], T=[];
  // La flexión empieza por la parte alta del cuello (es) y avanza hacia la base: la cabeza baja en arco, cerca del pecho.
  const hd=s=>{const es=Math.min(1,Math.max(0,e*2.6-1.6*(1-s)));return ((-86+18*s)*(1-es)+(-35+160*Math.pow(s,.8))*es+sw*(.4+.6*s))*Math.PI/180;};
  for(let i=0;i<N;i++){const h=hd((i+.5)/N);T.push([Math.cos(h),Math.sin(h)]);const q=P[i];P.push([q[0]+ds*T[i][0],q[1]+ds*T[i][1]]);}
  const f=n=>Math.round(n*10)/10, w=s=>5.6+8.4*Math.pow(1-s,2), side=[], back=[], strip=[];
  for(let i=0;i<=N;i++){
    const t=T[Math.min(i,N-1)], nx=-t[1], ny=t[0], q=P[i], ww=w(i/N);
    side.push([q[0]-nx*ww,q[1]-ny*ww,q[0]+nx*ww,q[1]+ny*ww]);
    if(i<N) strip.push([q[0]-nx*.35*ww,q[1]-ny*.35*ww,q[0]-nx*.8*ww,q[1]-ny*.8*ww]);
  }
  const t=T[N-1], nx=-t[1], ny=t[0], q=P[N], ww=w(1), cap=[];
  for(let k=1;k<4;k++){const a=Math.PI*(1-k/4);cap.push([q[0]+nx*ww*Math.cos(a)+t[0]*ww*Math.sin(a),q[1]+ny*ww*Math.cos(a)+t[1]*ww*Math.sin(a)]);}
  let d="M"+side.map(v=>f(v[0])+" "+f(v[1])).join(" L")+" L"+cap.map(v=>f(v[0])+" "+f(v[1])).join(" L");
  d+=" L"+side.slice().reverse().map(v=>f(v[2])+" "+f(v[3])).join(" L")+"Z";
  const dsx="M"+strip.map(v=>f(v[2])+" "+f(v[3])).join(" L")+" L"+strip.slice().reverse().map(v=>f(v[0])+" "+f(v[1])).join(" L")+"Z";
  return {d,ds:dsx,E:P[N]};
};

// Cuello flexible genérico (usado por el caballo): una sola forma continua cuya línea central conserva el largo y se curva
// de "erguido" (e=0) a "agachado" (e=1). rest/peck: rumbo en grados según la posición s (0 base, 1 cabeza). band: crin.
const bendNeck=(cfg,e,sw=0)=>{
  const {B,L,N,rest,peck,w,band}=cfg, ds=L/N, P=[B], T=[], f=n=>Math.round(n*10)/10;
  for(let i=0;i<N;i++){
    const s=(i+.5)/N, es=Math.min(1,Math.max(0,e*2.6-1.6*(1-s))), h=(rest(s)*(1-es)+peck(s)*es+sw*(.4+.6*s))*Math.PI/180;
    T.push([Math.cos(h),Math.sin(h)]); const q=P[i]; P.push([q[0]+ds*T[i][0],q[1]+ds*T[i][1]]);
  }
  const Lp=[], Rp=[], Mn=[], Mo=[];
  for(let i=0;i<=N;i++){
    const t=T[Math.min(i,N-1)], nx=-t[1], ny=t[0], q=P[i], ww=w(i/N), bo=ww+band*(i%2?1:.5);
    Lp.push([q[0]-nx*ww,q[1]-ny*ww]); Rp.push([q[0]+nx*ww,q[1]+ny*ww]);
    Mn.push([q[0]-nx*(ww-1),q[1]-ny*(ww-1)]); Mo.push([q[0]-nx*bo,q[1]-ny*bo]);
  }
  const poly=(a,b)=>"M"+a.map(v=>f(v[0])+" "+f(v[1])).join(" L")+" L"+b.slice().reverse().map(v=>f(v[0])+" "+f(v[1])).join(" L")+"Z";
  return {d:poly(Lp,Rp),band:poly(Mo,Mn),E:P[N]};
};

    Lp.push([P[i][0]-nx*W[i],P[i][1]-ny*W[i]]); Rp.push([P[i][0]+nx*W[i],P[i][1]+ny*W[i]]);}

// ---- Parejera (serpiente): cuerpo continuo que ondula; sin patas. La forma se recalcula en cada cuadro.
const snakeGeom=(m,e,ph,c)=>{
  const N=24, L=110, X0=8, G=66, f=n=>Math.round(n*10)/10, sm=t=>t*t*(3-2*t), A=3+7*m, P=[], W=[];
  for(let i=0;i<=N;i++){
    const s=i/N, w=s<.35?1.6+3.8*Math.sin(s/.35*Math.PI/2):(s<.9?5.4:5.4-1.4*(s-.9)/.1);
    const lift=16*e*sm(Math.min(1,Math.max(0,(s-.62)/.38)));
    P.push([X0+L*s,G-w-.5-A*(.5+.5*Math.sin(Math.PI*3*s+ph+c*.8))*(.35+.65*(1-s))-lift]); W.push(w);   // solo se arquea hacia arriba: nunca se hunde en el suelo
  }
  const Lp=[], Rp=[], Bp=[]; let bl="";
  for(let i=0;i<=N;i++){
    const a=P[Math.max(0,i-1)], b=P[Math.min(N,i+1)], dx=b[0]-a[0], dy=b[1]-a[1], n=Math.hypot(dx,dy)||1, nx=-dy/n, ny=dx/n, w=W[i];
    Lp.push([P[i][0]-nx*w,P[i][1]-ny*w]); Rp.push([P[i][0]+nx*w,P[i][1]+ny*w]); Bp.push([P[i][0]+nx*w*.35,P[i][1]+ny*w*.35]);
    if(i>=3&&i%3===0&&i<N-1){const r=w*.5, cx=P[i][0]-nx*w*.25, cy=P[i][1]-ny*w*.25; bl+=`M${f(cx-r)} ${f(cy)} a${f(r)} ${f(r*.8)} 0 1 0 ${f(2*r)} 0 a${f(r)} ${f(r*.8)} 0 1 0 ${-f(2*r)} 0Z`;}
  }
  const poly=(a,b)=>"M"+a.map(v=>f(v[0])+" "+f(v[1])).join(" L")+" L"+b.slice().reverse().map(v=>f(v[0])+" "+f(v[1])).join(" L")+"Z";
  const E=P[N], t0=P[N-1];
  return {d:poly(Lp,Rp),belly:poly(Bp,Rp),blot:bl,hx:E[0],hy:E[1],ha:Math.atan2(E[1]-t0[1],E[0]-t0[0])*180/Math.PI};
};

const gleg=c=>`M${c-2.5} 14 C${c-3.5} 18 ${c-5} 22 ${c-6} 24 L${c+4} 24 C${c+1} 22 ${c+1} 18 ${c+2} 14Z`;
const GLeg=({id,c,fill,r})=>(<g id={id} ref={r} style={{transformOrigin:`${c}px 15px`}}><path d={gleg(c)} fill={fill}/></g>);
const grnTail=(m,ph,c)=>{
  const N=14, L=60, f=n=>Math.round(n*10)/10, P=[], W=[], Lp=[], Rp=[];
  for(let i=0;i<=N;i++){const s=i/N; P.push([26-L*s,11+2*s+(1+3*m)*s*Math.sin(Math.PI*2.4*s-ph+c*.9)]); W.push(2.8*Math.pow(1-s,.9)+.5);}
  for(let i=0;i<=N;i++){const a=P[Math.max(0,i-1)], b=P[Math.min(N,i+1)], dx=b[0]-a[0], dy=b[1]-a[1], n=Math.hypot(dx,dy)||1, nx=-dy/n, ny=dx/n;
    Lp.push([P[i][0]-nx*W[i],P[i][1]-ny*W[i]]); Rp.push([P[i][0]+nx*W[i],P[i][1]+ny*W[i]]);}
  const q=a=>a.map(p=>f(p[0])+" "+f(p[1])).join(" L");
  return "M"+q(Lp)+" L"+q(Rp.slice().reverse())+"Z";
};

const LAY={vx0:0,vx1:1600,trunk:118,burrow:290,puddle:780,fx:1330};
const aspectOf=(w,h)=>Math.max(.4,Math.min(6,w/Math.max(1,h)));

  const o={trunk:LAY.trunk,burrow:LAY.burrow,fx:LAY.fx};
  LAY.vx0=vx0;LAY.vx1=vx1;LAY.trunk=vx0+118;LAY.burrow=vx0+Math.max(170,Math.min(290,290-Math.max(0,vx0)*.35));LAY.puddle=780;LAY.fx=vx1-270;
  return {trunk:LAY.trunk-o.trunk,burrow:LAY.burrow-o.burrow,fx:LAY.fx-o.fx};
};

function noiseStep(g,dt,level,limit,A,flee,onDone){
  const loud=level>limit;

    g.loudT=loud?g.loudT+dt:0;                       // un ruido breve no cuenta
    if(g.loudT>=NC.loudSec){g.phase="episode";g.cd=0;g.calmT=0;}
    return;
  }
  // Recuperación: un período de volumen adecuado rearma el sistema y cancela una advertencia pendiente.
  if(loud) g.calmT=0;

    g.calmT+=dt;
    if(g.calmT>=NC.calmSec){if(g.target)g.target.alert=false;g.target=null;g.phase="calm";g.loudT=0;g.cd=0;g.calmT=0;return;}
  }

  if(loud) g.cd+=dt;
  const leaving=A.some(a=>a.st==="out"&&!a.done);
  if(g.cd>=NC.warnAt&&!g.target){
    const c=A.filter(eligible);
    if(c.length&&!leaving){g.target=c[Math.random()*c.length|0];g.target.alert=true;}
    else g.cd=Math.min(g.cd,NC.warnAt);
  }
  if(g.target&&g.cd>=NC.countSec){

}

      if(ok){const n=active();if(n>LIM) retire(n>LIM+1?2:1);}
      else if(f.type==="tucutucu") A.filter(b=>!b.done&&!SP[b.type].fly&&!b.burrow&&b.st!=="out"&&b.st!=="bye"&&(Math.abs(b.x-(BX()+50))<b.half+150||Math.abs(b.stop-(BX()+50))<b.half+150)).forEach((b,i)=>softRetire(b,3+i*6));
      else if(f.type!=="laucha"&&f.type!=="urutau"&&!A.some(a=>a.retiring&&!a.done)) retire(1);
      return ok;
    };
    spawnTestRef.current=(type,side)=>{
      const T=SP[type]; if(!T) return "Especie desconocida.";
      const single=T.fly||T.burrow||T.still, n=A.filter(b=>b.type===type&&!b.done).length;
      if(n>=(single?1:2)) return single?"Ya hay uno de esa especie en escena.":"Ya hay dos de esa especie en escena.";
      if(pend.some(f=>f.type===type)) return "Esa aparición ya está en espera.";
      const f={type,side};
      if(tryManual(f)) return "";
      if(pend.length<3) pend.push(f);
      return "Sin espacio: libero animales antiguos y entra enseguida.";
    };
    const step=(a,dt)=>{
      const T=SP[a.type]; a.clk+=dt;
      a.pz=a.pz>.004?a.pz*(1-Math.min(1,dt*3)):0;
      if(!a.seen&&!a.burrow&&!a.mouse&&!a.still&&a.x>visNow()[0]&&a.x<visNow()[1]){a.seen=true;discoverRef.current(a.type);}
      if(a.burrow){burrowStep(a,dt);return;}
      if(a.mouse){mouseStep(a,dt);return;}
      if(a.still){stillStep(a,dt);return;}
      if(a.perch){perchStep(a,dt);return;}
      if(T.fly){
        if(a.st==="fly"){a.age+=dt;if(a.age>a.life&&!a.alert){a.dir=a.x<800?-1:1;a.st="bye";}}
        if(a.st==="fly"&&((a.dir>0&&a.x>vis()[1]-350)||(a.dir<0&&a.x<vis()[0]+350))) a.dir=-a.dir;
        a.fl+=(a.dir-a.fl)*Math.min(1,dt*2.2);
        a.x+=a.dir*a.V*dt*(a.st==="out"||a.st==="bye"?1:Math.max(.25,Math.abs(a.fl)));
        if(gone(a)){a.done=true;return;}
        const yy=a.y+22*Math.sin(a.clk*.35)+9*Math.sin(a.clk*.9+1)+(T.bob||0)*Math.sin(a.clk*4.2), bank=Math.sin(a.clk*.35+1.2)*2.5;
        a.root.setAttribute("transform",`translate(${a.x} ${yy}) rotate(${bank}) scale(${a.fl*a.s} ${a.s}) translate(${-T.cx} ${-T.gy})`);
        a.lyy=yy;a.lbank=bank;PZ=a.pz;T.pose(a.r,0,a.fold||0,a.clk); alertFx(a,dt); return;
      }
      a.fl+=(a.dir-a.fl)*Math.min(1,dt*3);
      const turn=Math.max(0,1-Math.abs(a.fl-a.dir)), hs=T.hs?T.hs(a.ph):1;   // hs: algunos animales (sapo) avanzan a saltos
      if(a.st!=="out"&&a.st!=="bye") a.age+=dt;
      if(a.st==="in"){
        const rem=(a.stop-a.x)*a.dir, tg=rem>200?a.V:Math.max(4,a.V*rem/200);
        a.v+=(tg-a.v)*Math.min(1,dt*1.6); a.x+=a.dir*a.v*dt*hs;
        if(rem<1.5){a.st="rest";a.t=0;a.rest=rnd(...T.rs);a.stop=a.x;}
      }else if(a.st==="rest"){
        a.v+=(0-a.v)*Math.min(1,dt*3); a.x+=a.dir*a.v*dt*turn*hs; a.t+=dt;
        if(a.age>a.life&&!a.alert){a.dir=a.x<800?-1:1;a.st="bye";}
        else if(a.rock&&a.t>a.rest){a.dir=a.x<800?-1:1;a.st="bye";}   // terminó de tomar sol: se va
        else if(a.t>a.rest&&!a.rock&&!wander(a)) a.rest+=rnd(2,4);
      }else if(a.st==="walk"){
        const rem=(a.stop-a.x)*a.dir, W=a.V*.6, tg=rem>120?W:Math.max(3,W*rem/120);
        a.v+=(tg-a.v)*Math.min(1,dt*1.4); a.x+=a.dir*a.v*dt*turn*hs;
        if(rem<1.5){a.st="rest";a.t=0;a.rest=rnd(...T.rs);a.stop=a.x;}
      }else{
        a.v+=(a.V-a.v)*Math.min(1,dt*1.2); a.x+=a.dir*a.v*dt*turn*hs;
        if(gone(a)){a.done=true;return;}
      }
      const hT=a.st==="rest"?T.tg(a):0;
      a.h+=(hT-a.h)*Math.min(1,dt*T.rt);
      a.ph+=a.v*turn*dt*T.c0/a.s;
      const m=cl(a.v*turn/a.V*1.4,0,1), e=a.h*a.h*(3-2*a.h);
      a.lift=(a.lift||0)+(((a.rock&&a.st==="rest")?a.rockH:0)-(a.lift||0))*Math.min(1,dt*3);   // sube a la piedra al detenerse y baja al irse
      a.root.setAttribute("transform",`translate(${a.x} ${a.y-(a.lift||0)}) scale(${a.fl*a.s} ${a.s}) translate(${-T.cx} ${-T.gy})`);
      a.lm=m;a.le=e;PZ=a.pz;T.pose(a.r,m*(1-a.pz),e*(1-a.pz),a.clk,Math.sin(a.ph),a.ph);
      alertFx(a,dt);
    };
    // Pausa: sin avanzar tiempo ni posición, cada animal pasa suavemente a una pose neutra y atenta.
    const pauseStep=(a,dt)=>{
      if(!a.root||a.done) return;
      if(a.pz>=1&&((a.perch&&!SP[a.type].side)||a.fl===a.dir||a.mouse||a.still)) return;
      const T=SP[a.type];
      a.pz+=(1-a.pz)*Math.min(1,dt*3.2); if(a.pz>.998) a.pz=1;
      a.fl+=(a.dir-a.fl)*Math.min(1,dt*3); if(Math.abs(a.fl-a.dir)<.002) a.fl=a.dir;
      PZ=a.pz;
      if(a.burrow){burrowPose(a);return;}
      if(a.mouse){mousePose(a);return;}
      if(a.still){stillPose(a);return;}
      if(T.fly){
        a.root.setAttribute("transform",`translate(${a.x} ${a.lyy||a.y}) rotate(${a.lbank||0}) scale(${((a.perch&&!T.side)?1:a.fl)*a.s} ${a.s}) translate(${-T.cx} ${-T.gy})`);
        T.pose(a.r,0,a.fold||0,a.clk);
      }else{
        a.root.setAttribute("transform",`translate(${a.x} ${a.y-(a.lift||0)}) scale(${a.fl*a.s} ${a.s}) translate(${-T.cx} ${-T.gy})`);
        T.pose(a.r,(a.lm||0)*(1-a.pz),(a.le||0)*(1-a.pz),a.clk,Math.sin(a.ph),a.ph);
      }
      alertFx(a,dt);
    };
    const E={top:document.getElementById("sky-top"),bot:document.getElementById("sky-bot"),lit:document.getElementById("lit"),
      stars:document.getElementById("stars"),moon:document.getElementById("moon"),glow:document.getElementById("glow")};
    const cyc={t:0,k:0,acc:0,was:false,dirty:false};
    const applyLight=(u,k)=>{
      const L=lightAt(u), D=LP.day, m=key=>mix(D[key],L[key],k), rgb=c=>"rgb("+c.map(Math.round).join(",")+")";
      E.top.setAttribute("stop-color",rgb(mix(D.top,L.top,k))); E.bot.setAttribute("stop-color",rgb(mix(D.bot,L.bot,k)));
      E.lit.style.filter=k<.003?"":`brightness(${m("b")}) saturate(${m("s")}) sepia(${m("sp")}) hue-rotate(${m("h")}deg)`;
      E.stars.setAttribute("opacity",m("st")); E.glow.setAttribute("opacity",m("gl")); E.moon.setAttribute("opacity",m("mo"));
      const mu=Math.max(0,Math.min(1,(u-.5)/.4));
      {const vv=visNow(),m0=vv[1]-350,m1=vv[0]+350; E.moon.setAttribute("transform",`translate(${m0+(m1-m0)*mu} ${300-70*Math.sin(Math.PI*mu)})`);}
    };
    cycSetRef.current=t=>{cyc.t=t;cyc.k=1;cyc.acc=0;cyc.dirty=true;applyLight(t,1);};
    const tick=now=>{
      const dt=Math.min(.05,(now-last)/1000); last=now;
      {  // ciclo día/noche: avanza solo sin pausa; al desactivarlo vuelve suavemente al paisaje diurno
        const c=cicloRef.current;
        cyc.k+=((c.on?1:0)-cyc.k)*Math.min(1,dt*1.5); if(!c.on&&cyc.k<.002) cyc.k=0;
        if(c.on&&!cyc.was) cyc.t=0; cyc.was=c.on;
        if(!pRef.current&&c.on) cyc.t=(cyc.t+dt/c.d)%1;
        cyc.acc+=dt;
        if(cyc.acc>.1){cyc.acc=0; if(cyc.k>0||cyc.dirty){applyLight(cyc.t,cyc.k);cyc.dirty=cyc.k>0;}}
      }
      uiT+=dt;
      if(uiT>.25){uiT=0;const k=gate.phase+Math.floor(gate.cd);if(k!==uiK){uiK=k;setUi({ph:gate.phase,cd:Math.floor(gate.cd)});}}
      if(lvRef.current){
        const lv=levelRef.current, lm=limitRef.current;
        lvRef.current.style.width=Math.max(0,Math.min(100,lv))+"%"; mkRef.current.style.left=lm+"%";
        pvRef.current.classList.toggle("over",lv>lm);
      }
      if(!pRef.current){
        if(juegoRef.current==="calma") noiseStep(gate,dt,levelRef.current,limitRef.current,A,flee,()=>{prog.v=0;prog.fixed=0;prog.jit=rnd(.9,1.1);prog.retry=0;});
        const loud=juegoRef.current==="calma"&&levelRef.current>limitRef.current;
        if(!loud&&gate.phase!=="episode"){                 // con ruido excesivo (o una advertencia en curso) la barra se detiene
          if(prog.retry>0) prog.retry-=dt;
          else{
            prog.v=Math.min(1,prog.v+dt/(prog.fixed||durRef.current*prog.jit));
            if(prog.v>=1){
              let ok=false;   // primero busca un sitio libre (probando otras especies); si no hay, entra igual y libera espacio
              for(let i=0;i<8&&!ok;i++) ok=spawn();
              for(let i=0;i<8&&!ok;i++) ok=spawn(null,true);
              if(ok){prog.v=0;prog.fixed=0;prog.jit=rnd(.9,1.1);const n=active();if(n>LIM) retire(n>LIM+1?2:1); else if(n>=LIM-2&&Math.random()<.6) retire(1,40);}   // cerca del máximo: retirada natural ocasional
              else prog.retry=1.2;
            }
          }
        }
        if(pend.length&&(pendT-=dt)<=0){   // apariciones de prueba en espera de espacio
          pendT=.6; const f=pend[0];
          if(tryManual(f)){pend.shift();spawnNotifyRef.current("");}
          else if((f.w=(f.w||0)+.6)>25){pend.shift();spawnNotifyRef.current("No se pudo hacer aparecer ese animal ahora.");}
        }
        if(fillRef.current){fillRef.current.style.width=(prog.v*100)+"%";pvRef.current.classList.toggle("hold",loud||gate.phase==="episode");}
        for(const a of A) if(a.root&&!a.done) step(a,dt);
        if(A.some(a=>a.done)){
          for(let i=A.length-1;i>=0;i--) if(A[i].done) A.splice(i,1);
          setList([...A]);
        }
      }else{
        for(const a of A) pauseStep(a,dt);
      }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[]);
  return(
    <div className={paused?"paused":""} style={{height:"100%"}}>
      <Scene R={R} list={list} vx0={vx0} vx1={vx1}/>
      <div className={"pz"+(paused?" on":"")} aria-live="polite">Pausa · Atentos</div>
      <div className="al">
        {albumOpen&&<div className="box">
          <div className="hd"><span>Especies descubiertas: {SPECIES.filter(sp=>found[sp.id]).length}/{SPECIES.length}</span><button className="x" onClick={()=>setAlbumOpen(false)} aria-label="Cerrar álbum">Cerrar</button></div>
          <Album found={found}/>
        </div>}
        <button className="tg" onClick={()=>{setAlbumOpen(o=>!o);setFresh(false);}} aria-expanded={albumOpen}>
          <svg className="ic" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3 3.5 C3 2.7 3.6 2.2 4.4 2.2 H15 C15.8 2.2 16.3 2.7 16.3 3.5 V16.5 C16.3 17.3 15.8 17.8 15 17.8 H4.4 C3.6 17.8 3 17.3 3 16.5Z" fill="#86bb6c" stroke="#4f8a45" strokeWidth="1" strokeLinejoin="round"/>
            <path d="M3 3.5 C3 2.7 3.6 2.2 4.4 2.2 H6.2 V17.8 H4.4 C3.6 17.8 3 17.3 3 16.5Z" fill="#5f9c53"/>
            <path d="M11.2 5.6 L12.3 8.2 L15 8.5 L13 10.3 L13.6 13 L11.2 11.6 L8.8 13 L9.4 10.3 L7.4 8.5 L10.1 8.2Z" fill="#ffe08a" stroke="#d9b043" strokeWidth=".7" strokeLinejoin="round"/>
          </svg>Álbum{fresh&&!albumOpen&&<span className="dot"/>}</button>
      </div>
      <div className="hud" ref={pvRef} data-modo={juego} role="group" aria-label="Indicadores">
        <span className="rw">Ruido</span><div className="trk rw"><i className="lv" ref={lvRef}/><b className="mk" ref={mkRef}/></div>
        <span>Próximo visitante</span><div className="trk"><i className="fill" ref={fillRef}/></div>
      </div>
      <div className="bar">
      <button className="pp" onClick={()=>setPaused(p=>!p)} aria-label={paused?"Reanudar":"Pausar"} title={paused?"Reanudar":"Pausar"}>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          {paused?<path d="M4 2.5 C4 1.8 4.7 1.4 5.3 1.8 L13 6.8 C13.6 7.2 13.6 8.8 13 9.2 L5.3 14.2 C4.7 14.6 4 14.2 4 13.5Z"/>
                 :<><path d="M3.5 2.6 C3.5 2 4 1.6 4.6 1.6 L5.6 1.6 C6.2 1.6 6.7 2 6.7 2.6 L6.7 13.4 C6.7 14 6.2 14.4 5.6 14.4 L4.6 14.4 C4 14.4 3.5 14 3.5 13.4Z"/><path d="M9.3 2.6 C9.3 2 9.8 1.6 10.4 1.6 L11.4 1.6 C12 1.6 12.5 2 12.5 2.6 L12.5 13.4 C12.5 14 12 14.4 11.4 14.4 L10.4 14.4 C9.8 14.4 9.3 14 9.3 13.4Z"/></>}
        </svg>
      </button>
      {fsOk&&<button className="pp fs" onClick={toggleFs} aria-label={isFs?"Salir de pantalla completa":"Pantalla completa"} title={isFs?"Salir de pantalla completa":"Pantalla completa"}>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d={isFs?"M6 2 V6 H2 M10 2 V6 H14 M14 10 H10 V14 M2 10 H6 V14":"M2 6 V2 H6 M10 2 H14 V6 M14 10 V14 H10 M6 14 H2 V10"}/>
        </svg>
      </button>}
        <button className="pp" onClick={()=>{setOpen(o=>!o);setAskReset(false);}} aria-expanded={open} aria-label="Ajustes" title="Ajustes">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" aria-hidden="true">
            <path d="M6.9 1.5h2.2l.4 1.7 1.2.5 1.5-.9 1.6 1.6-.9 1.5.5 1.2 1.7.4v2.2l-1.7.4-.5 1.2.9 1.5-1.6 1.6-1.5-.9-1.2.5-.4 1.7H6.9l-.4-1.7-1.2-.5-1.5.9-1.6-1.6.9-1.5-.5-1.2-1.7-.4V6.9l1.7-.4.5-1.2-.9-1.5 1.6-1.6 1.5.9 1.2-.5z"/>
            <circle cx="8" cy="8" r="2.1"/>
          </svg>
        </button>
      </div>
      {open&&<div className="np"><div className="box">
        <div className="hd2">Ajustes</div>
        <div className="lbl">Modo de juego</div>
        <div className="modes"><button className={juego==="calma"?"on":""} onClick={()=>chooseJuego("calma")}>Pradera en calma</button><button className={juego==="viva"?"on":""} onClick={()=>chooseJuego("viva")}>Pradera viva</button></div>
        <div className="lbl">Frecuencia de aparición</div>
        <div className="chips">{RITMOS.map(([m,t])=><button key={m} className={ritmo.m===m?"on":""} onClick={()=>chooseRitmo({...ritmo,m})}>{t}</button>)}</div>
        {ritmo.m==="personalizado"&&<label>Minutos entre apariciones<b>{ritmo.s} min</b>
          <input type="number" min="0.5" max="60" step="0.5" value={ritmo.s} onChange={e=>chooseRitmo({m:"personalizado",s:Math.min(60,Math.max(.5,+e.target.value||5))})}/></label>}
        {juego==="calma"&&<>
        <div className="lbl">Ruido</div>
        <div className="modes"><button className={mode==="mic"?"on":""} onClick={()=>chooseMode(mode==="mic"?"sim":"mic")}>{mode==="mic"?"Micrófono activado":"Activar micrófono"}</button></div>
        {mode==="mic"&&<label>Sensibilidad del micrófono (calibración)<b>{sens}</b>
          <input type="range" min="0" max="100" value={sens} onChange={e=>{const v=+e.target.value;setSens(v);sensRef.current=v;store.set("sensibilidad",v);}}/></label>}
        <label>Límite de ruido permitido<b>{lim}</b>
          <input type="range" min="0" max="100" value={lim} onChange={e=>{const v=+e.target.value;setLim(v);limitRef.current=v;store.set("limite",v);}}/></label>
        <div className={"st"+(vol>lim?" over":"")}>{vol>lim?"Demasiado ruido":"Tranquilo"}{mode==="mic"&&<span> · nivel {vol}</span>}{ui.ph==="episode"&&<span> · {ui.cd} s</span>}</div>
        {(mode==="mic"||msg)&&<div className="msg">{msg||(micSt==="activo"?"Micrófono activo · el audio no se graba":"Solicitando permiso…")}</div>}
        <div className="note">Con ruido por encima del límite durante {NC.loudSec} s, las apariciones se detienen. A los {NC.warnAt} s de la cuenta un animal muestra «!» y a los {NC.countSec} s se retira (uno por episodio), caminando o volando. Con {NC.calmSec} s de calma se cancela.</div>
        </>}
        <div className="sep"><button className="rs" onClick={()=>setPruebas(o=>!o)} aria-expanded={pruebas}>{pruebas?"Pruebas ▾":"Pruebas ▸"}</button></div>
        {pruebas&&<>
        {juego==="calma"&&<>
        <div className="lbl">Simulación del volumen {mode==="mic"?"(solo sin micrófono)":""}</div>
        <label>Volumen simulado<b>{vol}</b>
          <input type="range" min="0" max="100" value={vol} disabled={mode==="mic"} onChange={e=>{const v=+e.target.value;setVol(v);levelRef.current=v;simVolRef.current=v;}}/></label>
        </>}
        <div className="lbl">Duración del ciclo día y noche (acelerada para pruebas)</div>
        <div className="chips">{CICLO_D.map(([d,t])=><button key={d} className={ciclo.d===d?"on":""} onClick={()=>chooseCiclo({...ciclo,d})}>{t}</button>)}</div>
        <div className="lbl">Día y noche</div>
        <div className="modes"><button onClick={()=>cycSetRef.current(.02)}>☀️ Día</button><button onClick={()=>cycSetRef.current(.64)}>🌙 Noche</button></div>
        <div className="lbl">Hacer aparecer un animal</div>
        <select value={testSp} onChange={e=>{setTestSp(e.target.value);setTestMsg("");}}>{SPECIES.map(sp=><option key={sp.id} value={sp.id}>{sp.name}</option>)}</select>
        <div className="modes">{[[0,"Aleatorio"],[1,"Izquierda"],[-1,"Derecha"]].map(([v,t])=><button key={v} className={testSide===v?"on":""} onClick={()=>setTestSide(v)}>{t}</button>)}</div>
        <button className="rs" onClick={()=>setTestMsg(spawnTestRef.current(testSp,testSide))}>Hacer aparecer animal</button>
        {testMsg&&<div className="msg">{testMsg}</div>}
        <div className="sep">{askReset
          ?<div className="ask"><div>¿Reiniciar la pradera? Se borrarán los descubrimientos del álbum y los animales actuales desaparecerán para empezar de nuevo. Los ajustes se conservan.</div>
            <div className="row"><button className="rs danger" onClick={doReset}>Sí, reiniciar</button><button className="rs" onClick={()=>setAskReset(false)}>Cancelar</button></div></div>
          :<button className="rs" onClick={()=>setAskReset(true)}>Reiniciar pradera</button>}</div>
        </>}
      </div></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
